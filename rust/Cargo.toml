[package]
name = "bench_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12" }
hdrhistogram = "7"
csv = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "rustls-native-certs"] }
rustls = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
