worker_processes auto;
worker_rlimit_nofile 1048576;
error_log logs/error.log info;

pid logs/nginx.pid;

events {
  worker_connections 16384;
  multi_accept on;
  accept_mutex off;
  use epoll;
}

http {
  init_worker_by_lua_block {
    math.randomseed(ngx.now() * 1000 + ngx.worker.pid())
  }

  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  chunked_transfer_encoding off;
  keepalive_timeout  30;
  keepalive_requests 100000;
  reset_timedout_connection on;
  client_max_body_size 10m;
  client_body_buffer_size 256k;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 16k;
  server_tokens off;
  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;
  access_log off;

  http2_max_concurrent_streams 1024;
  http2_recv_buffer_size 256k;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;

  server {
    listen 8080 reuseport;
    server_name _;

    location = /health {
      default_type text/plain;
      content_by_lua_block {
        local body = "OK"
        ngx.header.content_length = #body
        ngx.print(body)
      }
    }

    location = /small {
      default_type application/octet-stream;
      # 4096-byte payload
      root html/static;
      try_files /small.bin =404;
    }

    location = /medium {
      default_type application/octet-stream;
      # 131072-byte payload
      root html/static;
      try_files /medium.bin =404;
    }

    location = /large {
      default_type application/octet-stream;
      # 1048576-byte payload
      root html/static;
      try_files /large.bin =404;
    }

    location = /json {
      default_type application/json;
      root html/static;
      try_files /json.json =404;
    }

    location = /rtb_mix_payload {
      internal;
      default_type application/json;
      root html/static;
      try_files /rtb_resp_8779.json =404;
    }

    location = /rtb_mix {
      default_type application/json;
      content_by_lua_block {
        ngx.req.read_body()
        -- pcap baseline: ~82.4% 204 responses, ~17.6% payload responses
        if math.random(10000) <= 8244 then
          return ngx.exit(204)
        end
        return ngx.exec("/rtb_mix_payload")
      }
    }

    location = /echo {
      content_by_lua_block {
        ngx.req.read_body()
        local data = ngx.req.get_body_data()
        if not data then
          local file = ngx.req.get_body_file()
          if file then
            local f = io.open(file, "rb")
            if f then
              data = f:read("*a")
              f:close()
            else
              data = ""
            end
          else
            data = ""
          end
        end
        ngx.header.content_length = #data
        ngx.print(data)
      }
    }

    location = /stream {
      default_type application/octet-stream;
      # 1048576 bytes total in 64 flushed chunks
      content_by_lua_block {
        ngx.header.content_length = 1048576
        local chunk = string.rep("a", 16384)
        for _ = 1, 64 do
          ngx.print(chunk)
          ngx.flush(true)
        end
      }
    }

    location ~ ^/delay/(\d+)$ {
      default_type text/plain;
      content_by_lua_block {
        local ms = tonumber(ngx.var[1]) or 0
        if ms < 0 then
          ms = 0
        end
        ngx.sleep(ms / 1000)
        local body = "delayed " .. ms .. "\n"
        ngx.header.content_length = #body
        ngx.print(body)
      }
    }

    location = /delay_var {
      default_type text/plain;
      content_by_lua_block {
        local ms = math.random(20, 200)
        ngx.sleep(ms / 1000)
        local body = "delayed " .. ms .. "\n"
        ngx.header.content_length = #body
        ngx.print(body)
      }
    }

    location = /delay_post {
      default_type application/json;
      content_by_lua_block {
        ngx.req.read_body()
        local ms = math.random(20, 200)
        ngx.sleep(ms / 1000)
        if math.random(10) == 1 then
          local f = io.open("html/static/json_32k.json", "rb")
          if f then
            local data = f:read("*a")
            f:close()
            ngx.header.content_length = #data
            ngx.print(data)
          else
            local body = "{\"error\":\"missing json_32k\"}\n"
            ngx.header.content_length = #body
            ngx.print(body)
          end
        else
          local body = "delayed " .. ms .. "\n"
          ngx.header.content_length = #body
          ngx.print(body)
        end
      }
    }
  }

  server {
    listen 8443 ssl reuseport;
    http2 on;
    server_name _;

    ssl_certificate certs/bench.crt;
    ssl_certificate_key certs/bench.key;
    ssl_session_timeout 10m;

    location = /health {
      default_type text/plain;
      content_by_lua_block {
        local body = "OK"
        ngx.header.content_length = #body
        ngx.print(body)
      }
    }

    location = /small {
      default_type application/octet-stream;
      # 4096-byte payload
      root html/static;
      try_files /small.bin =404;
    }

    location = /medium {
      default_type application/octet-stream;
      # 131072-byte payload
      root html/static;
      try_files /medium.bin =404;
    }

    location = /large {
      default_type application/octet-stream;
      # 1048576-byte payload
      root html/static;
      try_files /large.bin =404;
    }

    location = /json {
      default_type application/json;
      root html/static;
      try_files /json.json =404;
    }

    location = /rtb_mix_payload {
      internal;
      default_type application/json;
      root html/static;
      try_files /rtb_resp_8779.json =404;
    }

    location = /rtb_mix {
      default_type application/json;
      content_by_lua_block {
        ngx.req.read_body()
        -- pcap baseline: ~82.4% 204 responses, ~17.6% payload responses
        if math.random(10000) <= 8244 then
          return ngx.exit(204)
        end
        return ngx.exec("/rtb_mix_payload")
      }
    }

    location = /echo {
      content_by_lua_block {
        ngx.req.read_body()
        local data = ngx.req.get_body_data()
        if not data then
          local file = ngx.req.get_body_file()
          if file then
            local f = io.open(file, "rb")
            if f then
              data = f:read("*a")
              f:close()
            else
              data = ""
            end
          else
            data = ""
          end
        end
        ngx.header.content_length = #data
        ngx.print(data)
      }
    }

    location = /stream {
      default_type application/octet-stream;
      # 1048576 bytes total in 64 flushed chunks
      content_by_lua_block {
        ngx.header.content_length = 1048576
        local chunk = string.rep("a", 16384)
        for _ = 1, 64 do
          ngx.print(chunk)
          ngx.flush(true)
        end
      }
    }

    location ~ ^/delay/(\d+)$ {
      default_type text/plain;
      content_by_lua_block {
        local ms = tonumber(ngx.var[1]) or 0
        if ms < 0 then
          ms = 0
        end
        ngx.sleep(ms / 1000)
        local body = "delayed " .. ms .. "\n"
        ngx.header.content_length = #body
        ngx.print(body)
      }
    }

    location = /delay_var {
      default_type text/plain;
      content_by_lua_block {
        local ms = math.random(20, 200)
        ngx.sleep(ms / 1000)
        local body = "delayed " .. ms .. "\n"
        ngx.header.content_length = #body
        ngx.print(body)
      }
    }

    location = /delay_post {
      default_type application/json;
      content_by_lua_block {
        ngx.req.read_body()
        local ms = math.random(20, 200)
        ngx.sleep(ms / 1000)
        if math.random(10) == 1 then
          local f = io.open("html/static/json_32k.json", "rb")
          if f then
            local data = f:read("*a")
            f:close()
            ngx.header.content_length = #data
            ngx.print(data)
          else
            local body = "{\"error\":\"missing json_32k\"}\n"
            ngx.header.content_length = #body
            ngx.print(body)
          end
        else
          local body = "delayed " .. ms .. "\n"
          ngx.header.content_length = #body
          ngx.print(body)
        end
      }
    }
  }
}
